<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoE2 Campaign Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>PoE2 Campaign Tracker</h1>
      <span class="sub" id="meta"></span>
    </div>
    <div class="char-controls">
      <label for="charSelect" class="sr-only">Character</label>
      <select id="charSelect" title="Switch character"></select>
      <button data-action="char-new" title="Create a new character">New</button>
      <button data-action="char-rename">Rename</button>
      <button data-action="char-delete" class="danger">Delete</button>
    </div>
    <div class="toggles">
      <label class="switch"><input type="checkbox" id="hideHints"> Hide hints</label>
      <label class="switch"><input type="checkbox" id="hideExtra"> Hide extra info</label>
      <label class="switch" title="Show only the current act/interlude (F)"><input type="checkbox" id="focusMode"> Focus mode</label>
    </div>
    <div class="io">
      <button data-action="export">Export JSON</button>
      <button data-action="import">Import JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button data-action="settings" title="Change hotkeys" aria-label="Hotkey settings">⌨</button>
      <button data-action="help" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    </div>
  </header>

  <section id="now" class="now" aria-label="Current zone"></section>

  <div id="help" class="help card" hidden>
    <h2>Keyboard shortcuts</h2>
    <dl class="kv" id="helpKeys"></dl>
    <p class="muted small">Ticking the last required step of the zone you are timing also splits automatically.
      Hotkeys only work while this window has focus (use the helper's global hotkeys while in game).</p>
    <div class="row"><button data-action="settings">Change hotkeys…</button></div>
  </div>

  <div id="settings" class="help card" hidden role="dialog" aria-label="Hotkey settings">
    <h2>Hotkeys</h2>
    <p class="muted small">Click "Change", then press the new key. Esc cancels.</p>
    <table class="keys" id="keyTable"></table>
    <div class="error" id="keyError"></div>
    <div class="row"><button data-action="keys-reset">Reset defaults</button><button data-action="settings-close" class="primary">Done</button></div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <section class="card" id="totals" aria-label="Totals"></section>
      <section class="card" id="history" aria-label="Run history"></section>
      <section class="card" id="character" aria-label="Character"></section>
    </aside>
    <main id="campaign" aria-live="polite"></main>
  </div>

  <div id="toast" role="status"></div>

  <!-- Plain scripts (no modules) so the app also works from file:// -->
  <script src="data/campaign.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/run.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/autosplit.js"></script>
  <script src="js/pob.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
