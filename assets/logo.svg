<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Splitstone">
  <!-- Waystone-like hexagon with a vertical split / timer motif.
       Fills use currentColor so it inherits the theme accent. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity=".95"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <path fill="url(#g)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"
        d="M32 4 L54 17 V47 L32 60 L10 47 V17 Z"/>
  <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity=".45"
        d="M32 12 L46 20 V44 L32 52 L18 44 V20 Z"/>
  <line x1="32" y1="16" x2="32" y2="48" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-opacity=".9"/>
  <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
        d="M24 30 A10 10 0 0 1 40 30" stroke-opacity=".95"/>
  <circle cx="32" cy="30" r="1.8" fill="currentColor"/>
  <line x1="32" y1="30" x2="36" y2="24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
