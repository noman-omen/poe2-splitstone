name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Launch smoke (xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a npx electron . --smoke --no-sandbox 2>&1 | tee smoke.log
          grep -q SMOKE_OK smoke.log

  build-windows:
    needs: smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build Windows installer + portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            desktop/dist/Splitstone-Setup-*.exe
            desktop/dist/Splitstone-Portable-*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          # v1.2.3 is a full release; v1.3.0-beta.1 (any '-') is a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
